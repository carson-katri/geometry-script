name: generate nodes

# Regenerate api/nodes.py from a Blender release and open a PR when it changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      blender_version:
        description: "Blender version, e.g. 5.2.0 (default: newest release)"
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Blender version
        id: version
        run: |
          version="${{ github.event.inputs.blender_version }}"
          if [ -z "$version" ]; then
            series=$(curl -fsSL https://download.blender.org/release/ \
              | grep -oP 'Blender\K[0-9]+\.[0-9]+(?=/)' | sort -V | tail -1)
            version=$(curl -fsSL "https://download.blender.org/release/Blender${series}/" \
              | grep -oP "blender-\K${series//./\\.}\.[0-9]+(?=-linux-x64\.tar\.xz\")" | sort -V | tail -1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Install Blender ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxkbcommon0 libxrender1 libsm6 libgl1 libegl1
          curl -fsSL "https://download.blender.org/release/Blender${{ steps.version.outputs.series }}/blender-${{ steps.version.outputs.version }}-linux-x64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-${{ steps.version.outputs.version }}-linux-x64" >> "$GITHUB_PATH"

      - name: Generate node functions
        run: |
          blender -b --factory-startup --python-exit-code 1 \
            --python code_generator/node_functions_generator.py -- --output api/nodes.py

      - name: Smoke test
        run: blender -b --factory-startup --python-exit-code 1 --python tests/smoke_test.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: generated/blender-${{ steps.version.outputs.version }}
          title: Regenerate nodes for Blender ${{ steps.version.outputs.version }}
          commit-message: Regenerate nodes for Blender ${{ steps.version.outputs.version }}
          add-paths: api/nodes.py
          body: Generated by the `generate nodes` workflow.
